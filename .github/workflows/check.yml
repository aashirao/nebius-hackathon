name: Build and test Pocketwise
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          javac -d /tmp/pocketwise-test android/app/src/main/java/in/pocketwise/app/TransactionParser.java tests/CoreTest.java
          java -cp /tmp/pocketwise-test CoreTest
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pocketwise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
